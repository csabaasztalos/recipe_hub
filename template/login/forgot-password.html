<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>%!TITLE!%</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles/main/style.css">
    <link rel="icon" href="/content/images/favicon.png">
</head>

<body>
<div class="forgotPassContent">
    <div class="forgotPassContainer">
        <h1 class="passFormHeader">%!HEADER!%</h1>
        <small class="forgotText">%!SMALLTEXT!%</small><br>
        <form class="passForm" method="post">
            <div class="input-group">
                <input type="email" id="user" name="email" placeholder="Email cím" required>
            </div>
            <button type="submit" class="sendForgotEmail" name="send">%!SENDBTN!%</button>
        </form>
        <p class="loginResult %!RESULTSTATUS!%">%!RESULT!%</p>
    </div>
</div>
    <script src="/js/login/showPassword.js"></script>
</body>

</html>
